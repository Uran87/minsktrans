<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060b16" />
    <meta name="color-scheme" content="dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23fbbf24'/%3E%3Ctext x='32' y='44' font-family='Segoe UI,Arial,sans-serif' font-size='38' font-weight='800' text-anchor='middle' fill='%2307101f'%3EМ%3C/text%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="Онлайн-карта городского пассажирского транспорта Минска в реальном времени: автобусы, троллейбусы и трамваи."
    />
    <title>МинскТранс — транспорт онлайн</title>
  </head>
  <body>
    <div id="app">
      <div id="map" class="map" role="application" aria-label="Карта транспорта Минска"></div>

      <div id="map-controls" class="map-controls" role="group" aria-label="Управление картой">
        <span class="map-controls-title">Слой</span>
        <div id="layer-toggle" class="chips" role="group" aria-label="Базовый слой карты">
          <button type="button" class="chip" data-layer="map">Схема</button>
          <button type="button" class="chip" data-layer="satellite">Спутник</button>
          <button type="button" class="chip" data-layer="hybrid">Гибрид</button>
        </div>
      </div>

      <button id="hamburger" class="hamburger" type="button" aria-label="Открыть панель управления">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>

      <aside id="sidebar" class="sidebar" aria-label="Панель управления">
        <header class="brand">
          <h1>Транспорт в реальном времени</h1>
          <button id="sidebar-close" class="icon-btn sidebar-close" type="button" aria-label="Закрыть панель">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
          </button>
        </header>

        <form id="route-form" class="route-form" autocomplete="off">
          <div class="field">
            <span class="field-label">Тип транспорта</span>
            <div id="transport-toggle" class="segmented" role="tablist" aria-label="Тип транспорта">
              <button type="button" class="segment" data-type="bus" role="tab">Автобус</button>
              <button type="button" class="segment" data-type="trolleybus" role="tab">Троллейбус</button>
              <button type="button" class="segment" data-type="tram" role="tab">Трамвай</button>
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="route-input">Номер маршрута</label>
            <div class="input-wrap">
              <span class="input-prefix" aria-hidden="true">№</span>
              <input
                id="route-input"
                type="text"
                inputmode="text"
                value=""
                maxlength="8"
                placeholder="Выберите маршрут"
                spellcheck="false"
                enterkeyhint="go"
                role="combobox"
                aria-autocomplete="list"
                aria-expanded="false"
                aria-controls="route-menu"
              />
              <ul id="route-menu" class="route-menu" role="listbox" aria-label="Маршруты" hidden></ul>
            </div>
          </div>

        </form>

        <section id="vehicles-block" class="vehicles-block" aria-label="Машины на маршруте" hidden>
          <div class="block-head">
            <div class="block-heading">
              <h2>Машины на маршруте</h2>
              <p id="vehicles-route" class="block-subtitle"></p>
            </div>
            <span id="vehicles-badge" class="badge">0</span>
          </div>
          <ul id="vehicles-list" class="vehicles-list"></ul>
        </section>

        <button id="schedule-open" class="btn btn-ghost schedule-open" type="button" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M7 3v3M17 3v3M4 9h16M6 5h12a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span>Полное расписание на день</span>
        </button>

        <section class="settings" aria-label="Настройки данных">
          <div class="block-head">
            <h2>Данные</h2>
          </div>

          <label class="switch-row">
            <span class="switch-copy">
              <strong>Демо-данные</strong>
              <small>Маршрут №1 без обращения к API</small>
            </span>
            <span class="switch">
              <input id="mock-toggle" type="checkbox" role="switch" />
              <span class="switch-slider" aria-hidden="true"></span>
            </span>
          </label>

          <p class="api-hint">API: <code id="api-base-label">/api/v1</code></p>
        </section>
      </aside>

      <aside id="details" class="details" role="dialog" aria-modal="false" aria-labelledby="details-title" hidden>
        <header class="details-head">
          <div class="details-heading">
            <span id="details-kicker" class="details-kicker">Транспорт</span>
            <h2 id="details-title">—</h2>
          </div>
          <button id="details-close" class="icon-btn" type="button" aria-label="Закрыть карточку">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
          </button>
        </header>
        <div id="details-body" class="details-body"></div>
      </aside>

      <div
        id="schedule-modal"
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="schedule-title"
        hidden
      >
        <div class="modal-backdrop" data-schedule-close></div>
        <div class="modal-panel">
          <header class="modal-head">
            <div class="modal-heading">
              <span id="schedule-kicker" class="details-kicker">Расписание</span>
              <h2 id="schedule-title">Полное расписание на день</h2>
            </div>
            <button id="schedule-close" class="icon-btn" type="button" aria-label="Закрыть расписание">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              </svg>
            </button>
          </header>
          <p id="schedule-summary" class="modal-summary" hidden></p>
          <div id="schedule-body" class="modal-body"></div>
        </div>
      </div>

      <div id="stop-popup" class="stop-popup" role="dialog" aria-label="Информация об остановке" hidden>
        <button id="stop-popup-close" class="stop-popup-close" type="button" aria-label="Закрыть информацию об остановке">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
        <div id="stop-popup-body" class="stop-popup-body"></div>
      </div>

      <div id="toasts" class="toasts" aria-live="assertive" aria-atomic="false"></div>
      <div id="loading-bar" class="loading-bar" aria-hidden="true"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
